    <!-- Discover the customer manifest and capture its install event before the React app loads.
         Staff routes intentionally do not receive the customer manifest. -->
    <script>
      (function () {
        var path = window.location.pathname;
        var isStaffRoute = path.startsWith('/admin') || path.startsWith('/agent');

        if (!isStaffRoute) {
          var manifest = document.createElement('link');
          manifest.id = 'customer-manifest';
          manifest.rel = 'manifest';
          manifest.href = '/customer.webmanifest';
          document.head.appendChild(manifest);

          window.addEventListener('beforeinstallprompt', function (event) {
            if (window.location.pathname.startsWith('/admin') ||
                window.location.pathname.startsWith('/agent')) return;

            event.preventDefault();
            window.__ccsCustomerInstallPrompt = event;
            window.dispatchEvent(new Event('ccs-customer-install-available'));
          });
        }
      })();
    </script>
